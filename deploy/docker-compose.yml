# docker-compose de migração Render -> Contabo.
# Suba com:  docker compose -f deploy/docker-compose.yml up -d --build
#
# Preencha os segredos em deploy/.env (NÃO comitar .env). Veja deploy/MIGRACAO.md.
# Serviços com "build:" apontando para outros repos: clone-os ao lado deste
# e ajuste o caminho, OU troque por "image:" se já tiver imagem publicada.

services:
  # 1) Proxy reverso + HTTPS automático
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site

  # 2) Banco de dados (substitui o calculadoras-db do Render + o Postgres do Supabase)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Não exponha a porta publicamente; os serviços acessam via rede interna "db:5432".

  # 3) Site das ferramentas (ESTE repo) - pronto
  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PORTAL_AUTH_REQUIRED: "True"
      PORTAL_APP_URL: "https://app.portalnotarial.com.br"
      PORTAL_ACCESS_COOKIE_MAX_AGE: "7200"
      PORTAL_TOOL_ACCESS_SECRET: ${PORTAL_TOOL_ACCESS_SECRET}   # tem que bater com o portal-app
    expose:
      - "3000"

  # 4) Backend Consulta PEP (código em ./backend deste repo) - quase pronto
  consulta-pep:
    build:
      context: ../backend
      dockerfile: Dockerfile        # criar um Dockerfile simples em backend/ (ver MIGRACAO.md)
    restart: unless-stopped
    environment:
      PORT: "8000"
    expose:
      - "8000"

  # ---------------------------------------------------------------------------
  # TEMPLATES (outros repos). Copie este bloco e ajuste para cada serviço:
  #   portal-app (Node), selo-digital (Python), cpf-rf (Python),
  #   agenda-cartorios (Python), calculadoras (Python), ganho-de-capital (Python),
  #   itcmd-sp (Python), organizador-de-arquivos (Python), exigencia-imob (Node),
  #   pagina-inicial (Node/Python)
  # ---------------------------------------------------------------------------
  # portal-app:
  #   build: { context: ../portal-notarial-app }
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  #     PORTAL_TOOL_ACCESS_SECRET: ${PORTAL_TOOL_ACCESS_SECRET}
  #     MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
  #     # (removidos: SUPABASE_URL, SUPABASE_KEY, STRIPE_*)
  #   depends_on: [db]
  #   expose: ["3000"]

volumes:
  db_data:
  caddy_data:
  caddy_config:
